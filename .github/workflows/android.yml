name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root:"
          pwd
          echo "Top-level files:"
          ls -la

          SETTINGS_FILE=$(find . -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -not -path '*/.gradle/*' -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "FOUND_GRADLE_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project root: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$FOUND_GRADLE_PROJECT"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenAnimationStudio-debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
